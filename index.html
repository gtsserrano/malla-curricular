<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malla Curricular · Ingeniería de Sistemas e Inteligencia Artificial · UPSA</title>
  </head>
  <body>
    <header id="encabezado"></header>

    <main id="malla">
      <div id="etiquetas"></div>
      <div id="tablero"></div>
    </main>

    <!-- Capa de la tarjeta 3D -->
    <div id="capa-tarjeta">
      <div id="tarjeta">
        <div class="cara frente"></div>
        <div class="cara reverso"></div>
      </div>
    </div>

    <!-- Puntero controlado por la mano -->
    <div id="puntero"><div class="anillo"></div></div>

    <!-- Vista previa de la cámara con el esqueleto de la mano detectada -->
    <div id="vista-camara">
      <video id="camara" autoplay playsinline muted></video>
      <canvas id="esqueleto"></canvas>
    </div>
    <div id="estado">Cargando cámara…</div>
    <button id="activar-camara" type="button" hidden>Reintentar cámara</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
